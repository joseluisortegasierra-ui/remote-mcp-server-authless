name: Comprobar secreto Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.JLOS || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN || secrets.TOKEN_DE_LA_API_DE_CLOUDFLARE }}
    steps:
      - name: Comprobar disponibilidad sin mostrar valor
        id: secret
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "state=disponible_y_enmascarado" >> "$GITHUB_OUTPUT"
          else
            echo "state=ausente" >> "$GITHUB_OUTPUT"
          fi

      - name: Registrar resultado
        env:
          GH_TOKEN: ${{ github.token }}
          SECRET_STATE: ${{ steps.secret.outputs.state }}
        shell: bash
        run: |
          cat > report.md <<EOF
          ## Comprobación de secreto Cloudflare

          - Estado: \`$SECRET_STATE\`
          - Repositorio: \`$GITHUB_REPOSITORY\`
          - Entorno consultado: \`production\`
          - Ejecución: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Ningún valor secreto fue leído, impreso o almacenado.
          EOF
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file report.md
